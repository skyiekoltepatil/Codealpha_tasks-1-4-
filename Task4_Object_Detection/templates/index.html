<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Object Tracking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #000000;
            background-image: url('https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?q=80&w=2574&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }
        .mac-window {
            background: rgba(30, 30, 32, 0.85);
            border-radius: 12px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.1);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            overflow: hidden;
            width: 90%;
            max-width: 900px;
        }
        .mac-titlebar {
            height: 52px;
            background: linear-gradient(to bottom, #3a3a3c, #2c2c2e);
            border-bottom: 1px solid #1c1c1e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
        }
        .traffic-lights { display: flex; gap: 8px; width: 60px; }
        .light { width: 12px; height: 12px; border-radius: 50%; }
        .close { background-color: #ff5f56; border: 1px solid #e0443e; }
        .minimize { background-color: #ffbd2e; border: 1px solid #dea123; }
        .maximize { background-color: #27c93f; border: 1px solid #1aab29; }
        .window-title { font-size: 14px; font-weight: 600; color: #e5e5ea; display: flex; align-items: center; gap: 6px; }
        .content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .video-container {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: #000;
        }
        img {
            width: 100%;
            display: block;
        }
        .info {
            margin-top: 15px;
            color: #98989d;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="mac-window">
        <header class="mac-titlebar">
            <div class="traffic-lights">
                <div class="light close"></div>
                <div class="light minimize"></div>
                <div class="light maximize"></div>
            </div>
            <div class="window-title">
                <i class="fa-solid fa-eye"></i> YOLOv8 Object Tracking
            </div>
            <div style="width: 60px;"></div>
        </header>
        <div class="content">
            <div class="video-container">
                <img src="/video_feed" alt="Real-time Object Tracking Stream">
            </div>
            <div class="info">
                <p>Tracking algorithm: BoT-SORT | Detection Model: YOLOv8</p>
                <p><i>Using a sample pedestrian video to bypass macOS camera permission blocks. You can change <code>video_path = 0</code> in app.py to use your webcam!</i></p>
            </div>
        </div>
    </div>
</body>
</html>
